services:
  backend:
    build: ./server
    container_name: realtime-editor-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - profile_uploads:/app/uploads

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    container_name: realtime-editor-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  profile_uploads:
